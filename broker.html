<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>สำหรับนายหน้า · บ้านคุณเตริก · บ้านพัทยา</title><style>*{box-sizing:border-box}body{margin:auto;max-width:700px;padding:24px;background:#f3f7fc;color:#122b4b;font:17px/1.6 system-ui,sans-serif}section{background:white;margin:18px 0;padding:22px;border-radius:16px}label,input,select{display:block;width:100%}input,select,button,.preview{font:inherit;padding:10px;border:1px solid #8094ab;border-radius:8px;margin:4px 0 12px;background:white}button,.preview{cursor:pointer;color:#12478b}button.primary{background:#165dc9;color:white}h2{font-size:21px;margin:0 0 12px}a{color:#1455a6}output{display:block}</style><style>#gBtn{display:none;margin:6px 0 4px;background:#164e70;color:#fff;border:0;border-radius:30px;padding:10px 20px;font-weight:700}#gm{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,30,55,.78);padding:16px}#gm.on{display:flex}#gm .box{width:min(100%,760px);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}#gm video{display:block;width:100%;aspect-ratio:16/9;background:#0f2747}#gm .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px}#gm .bar b{font-size:16px}#gm .bar button{margin:0;padding:8px 16px;border-radius:30px}#gm .skip{background:#164e70;color:#fff;border:0}#gm label{display:flex;gap:6px;align-items:center;width:auto;font-size:14px;color:#5b6b78}#gm label input{display:inline;width:auto;margin:0}</style><a href="homes.html">กลับหน้าหลัก</a><h1>สำหรับนายหน้า</h1><button id="gBtn" type="button">▶️ ดูวิธีใช้กับน้องเตริก</button><section><label>เลือกบ้าน<select id="house"><option value="house-chaiyaphruek.html">ชัยพฤกษ์ ติดทางรถไฟ</option><option value="house-maab49.html">บ้านเดี่ยวชั้นเดียว มาบยายเลีย 49</option><option value="house-noenplubwan.html">ทาวน์โฮม เนินพลับหวานวิลเลจ</option><option value="house-poolvilla-siam.html">พูลวิลล่า คันทรีคลับ ซอยสยาม</option><option value="house-pornthep7.html">พรเทพ 7 ชั้นเดียว</option><option value="house-rk10.html">รัตนากร 10 · The New Collection</option><option value="house-rk12.html">รัตนากร 12 (หลังริม)</option><option value="house-wanali-20.html">วนาลี หนองเกตุใหญ่</option><option value="house-wanali-rim.html">วนาลี หนองเกตุใหญ่ (หลังริม)</option></select></label><label id="unitLabel" hidden>เลขที่บ้าน<select id="unit"><option value="">ภาพรวมโครงการ</option><option>160/35</option><option>160/36</option><option>160/37</option><option>160/38</option></select></label><p id="summary"></p></section><section><h2>ลิงก์บ้านสำหรับลูกค้า</h2><form id="form"><label>ชื่อนายหน้าที่ให้ลูกค้าเห็น<input id="agentName" maxlength="80" required autocomplete="name"></label><label>เบอร์ติดต่อนายหน้า<input id="phone" type="tel" required autocomplete="tel"></label><button class="primary">สร้างลิงก์ส่งลูกค้า</button></form><div id="result" hidden><input id="url" aria-label="ลิงก์สำหรับลูกค้า" readonly><a id="preview" target="_blank" rel="noopener">ดูหน้าที่ลูกค้าจะเห็น</a> <button id="copyLink">คัดลอกลิงก์</button></div></section><section><h2>ส่งข้อมูลบ้านเอง</h2><button id="details">คัดลอกรายละเอียดบ้าน</button> <button id="photos">ดาวน์โหลดรูปทั้งหมด</button></section><output aria-live="polite" id="msg"></output><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="broker.js?v=2"></script><div id="gm" role="dialog" aria-modal="true" aria-label="วิธีใช้หน้านายหน้า"><div class="box"><video id="gv" playsinline preload="auto" poster="intro-poster.jpg"></video><div class="bar"><b>👋 น้องเตริกสอนวิธีสร้างลิงก์ส่งลูกค้า</b><span><button id="gSnd" type="button">🔊 เปิดเสียง</button> <button class="skip" id="gX" type="button">ข้าม · เริ่มใช้งาน</button></span><label><input type="checkbox" id="gNo"> ไม่ต้องแสดงอีก</label></div></div></div><script>(async()=>{const V="",L=["broker-guide/broker-guide-1.mp4","broker-guide/broker-guide-2.mp4","broker-guide/broker-guide-3.mp4"],ok=[];for(const f of L){try{const r=await fetch(V+f,{method:"HEAD",cache:"no-store"});if(r.ok)ok.push(V+f)}catch(e){}}if(!ok.length)return;const m=document.getElementById("gm"),v0=document.getElementById("gv"),s=document.getElementById("gSnd"),x=document.getElementById("gX"),no=document.getElementById("gNo");const vids=ok.map((src,i)=>{const v=i?v0.cloneNode():v0;if(i){v.removeAttribute("id");v0.parentNode.insertBefore(v,v0.nextSibling)}v.preload="auto";v.src=src;v.playsInline=true;v.style.display=i?"none":"block";v.load();return v});let cur=0,muted=false;const evs=["pointerdown","touchstart","keydown"];const lbl=()=>s.textContent=muted?"🔇 เปิดเสียง":"🔊 ปิดเสียง";function unlock(){muted=false;vids[cur].muted=false;lbl();evs.forEach(t=>removeEventListener(t,unlock,true))}function playIdx(i){cur=i;vids.forEach((v,k)=>{v.style.display=k===i?"block":"none";if(k!==i)v.pause()});const v=vids[i];v.currentTime=0;v.muted=muted;v.play().then(lbl).catch(()=>{muted=true;v.muted=true;v.play().catch(()=>{});lbl();evs.forEach(t=>addEventListener(t,unlock,{capture:true}))})}vids.forEach((v,i)=>{v.onended=()=>{if(i+1<vids.length)playIdx(i+1);else close()};v.onclick=()=>{if(muted)unlock()}});function open(){m.classList.add("on");playIdx(0)}function close(){vids.forEach(v=>v.pause());m.classList.remove("on");evs.forEach(t=>removeEventListener(t,unlock,true));try{if(no.checked)localStorage.setItem("bkGuideSkip","1")}catch(e){}}s.onclick=e=>{e.stopPropagation();muted=!muted;vids[cur].muted=muted;if(!muted)vids[cur].play();evs.forEach(t=>removeEventListener(t,unlock,true));lbl()};x.onclick=close;m.onclick=e=>{if(e.target===m)close()};addEventListener("keydown",e=>{if(e.key==="Escape"&&m.classList.contains("on"))close()});const b=document.getElementById("gBtn");b.style.display="inline-block";b.onclick=open;let skip=false;try{skip=localStorage.getItem("bkGuideSkip")==="1"}catch(e){}if(!skip)open();})()</script></html>
